services:
  - type: web
    name: toonworld4all-bot
    runtime: python
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: python toonworld4all_bot_final.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        value: "829342319"
      - key: PORT
        value: 8080
      - key: PYTHON_VERSION
        value: "3.11.11"
